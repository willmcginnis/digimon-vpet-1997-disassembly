<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="t d"><title id="t">One 16-bit word on the prong</title><desc id="d">Pulse-width encoding on a single open-drain line, as modelled by BrickEmuPy's CON_DGM.</desc><rect width="100%" height="100%" fill="#1a1a19"/><text x="24.0" y="32.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#f0efec" text-anchor="start" font-weight="bold">One 16-bit word on the link prong (packet EC13)</text><text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal">Single wire, pulled high when idle. Each bit is a high/low pair whose split encodes the value.</text><text x="129.0" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">1</text><text x="179.1" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">1</text><text x="219.3" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">0</text><text x="267.7" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">0</text><text x="325.9" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">1</text><text x="366.2" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">0</text><text x="414.6" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">0</text><text x="462.9" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">0</text><text x="511.3" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">0</text><text x="559.7" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">0</text><text x="617.9" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">1</text><text x="668.0" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">1</text><text x="708.2" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">0</text><text x="766.5" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">1</text><text x="816.6" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">1</text><text x="866.7" y="110.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#f0efec" text-anchor="middle" font-weight="bold">1</text><path d="M 20.0 120.0 L 40.0 170.0 L 40.4 170.0 L 40.4 120.0 L 63.2 120.0 L 63.2 170.0 L 73.9 170.0 L 73.9 120.0 L 96.7 120.0 L 96.7 170.0 L 107.4 170.0 L 107.4 120.0 L 138.5 120.0 L 138.5 170.0 L 157.5 170.0 L 157.5 120.0 L 188.6 120.0 L 188.6 170.0 L 207.6 170.0 L 207.6 120.0 L 219.0 120.0 L 219.0 170.0 L 256.0 170.0 L 256.0 120.0 L 267.4 120.0 L 267.4 170.0 L 304.4 170.0 L 304.4 120.0 L 335.5 120.0 L 335.5 170.0 L 354.5 170.0 L 354.5 120.0 L 365.9 120.0 L 365.9 170.0 L 402.9 170.0 L 402.9 120.0 L 414.2 120.0 L 414.2 170.0 L 451.2 170.0 L 451.2 120.0 L 462.6 120.0 L 462.6 170.0 L 499.6 170.0 L 499.6 120.0 L 511.0 120.0 L 511.0 170.0 L 548.0 170.0 L 548.0 120.0 L 559.4 120.0 L 559.4 170.0 L 596.3 170.0 L 596.3 120.0 L 627.4 120.0 L 627.4 170.0 L 646.4 170.0 L 646.4 120.0 L 677.5 120.0 L 677.5 170.0 L 696.5 170.0 L 696.5 120.0 L 707.9 120.0 L 707.9 170.0 L 744.9 170.0 L 744.9 120.0 L 776.0 120.0 L 776.0 170.0 L 795.0 170.0 L 795.0 120.0 L 826.1 120.0 L 826.1 170.0 L 845.1 170.0 L 845.1 120.0 L 876.2 120.0 L 876.2 170.0 L 895.2 170.0 L 895.2 120.0 L 970.0 120.0" stroke="#3987e5" stroke-width="2" fill="none"/><text x="18.0" y="124.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#898781" text-anchor="end" font-weight="normal">H</text><text x="18.0" y="174.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#898781" text-anchor="end" font-weight="normal">L</text><text x="42.0" y="192.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="normal">start ≈ 64 ms low</text><text x="42.0" y="206.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">(drawn compressed)</text><text x="190.0" y="192.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="normal">← 2 sync periods</text><text x="966.0" y="192.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#c3c2b7" text-anchor="end" font-weight="normal">end</text><text x="40.0" y="240.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#f0efec" text-anchor="start" font-weight="bold">Timing</text><text x="40.0" y="258.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="normal">bit 0  high 1.01 ms  low 3.27 ms</text><text x="40.0" y="274.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="normal">bit 1  high 2.75 ms  low 1.68 ms</text><text x="40.0" y="290.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="normal">sync   high 2.01 ms  low 0.95 ms</text><text x="420.0" y="240.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#f0efec" text-anchor="start" font-weight="bold">Reading the value</text><text x="420.0" y="258.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="normal">bits go out least-significant first; DMComm writes words in that order,</text><text x="420.0" y="274.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="normal">so EC13 = 0xEC13 read from bit 0 upward. Whole word ≈ 146 ms.</text><text x="420.0" y="298.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">Source: BrickEmuPy peripherals/CON_DGM.py (modelled timings, documented).</text></svg>