<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="t d"><title id="t">The main super-loop at 0x0132</title><desc id="d">Twelve calls per pass, then HALT until an interrupt.</desc><rect width="100%" height="100%" fill="#fcfcfb"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><text x="24.0" y="32.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="bold">One pass of the main loop (0x0132–0x016D)</text><text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Every pass calls the same twelve routines in the same order, then sleeps until an interrupt.</text><rect x="60.0" y="80.0" width="6.0" height="30.0" rx="2" fill="#b9b7af"/><rect x="68.0" y="80.0" width="520.0" height="30.0" rx="4" fill="#f3f2ef" stroke="#c3c2b7" stroke-width="1"/><text x="78.0" y="100.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">0010</text><text x="130.0" y="100.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">cpu_clock_fast</text><text x="320.0" y="100.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">switch CPU to the fast oscillator</text><line x1="110.0" y1="110.0" x2="110.0" y2="116.0" stroke="#c3c2b7" stroke-width="1"/><rect x="60.0" y="116.0" width="6.0" height="30.0" rx="2" fill="#eb6834"/><rect x="68.0" y="116.0" width="520.0" height="30.0" rx="4" fill="#f3f2ef" stroke="#c3c2b7" stroke-width="1"/><text x="78.0" y="136.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">01CA</text><text x="130.0" y="136.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">task_mark_awake</text><text x="320.0" y="136.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">restart the clock-timer flag</text><line x1="110.0" y1="146.0" x2="110.0" y2="152.0" stroke="#c3c2b7" stroke-width="1"/><rect x="60.0" y="152.0" width="6.0" height="30.0" rx="2" fill="#1baf7a"/><rect x="68.0" y="152.0" width="520.0" height="30.0" rx="4" fill="#f3f2ef" stroke="#c3c2b7" stroke-width="1"/><text x="78.0" y="172.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">0900</text><text x="130.0" y="172.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">task_timekeeping</text><text x="320.0" y="172.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">LCD timeout, clock, sleep schedule</text><line x1="110.0" y1="182.0" x2="110.0" y2="188.0" stroke="#c3c2b7" stroke-width="1"/><rect x="60.0" y="188.0" width="6.0" height="30.0" rx="2" fill="#eda100"/><rect x="68.0" y="188.0" width="520.0" height="30.0" rx="4" fill="#f3f2ef" stroke="#c3c2b7" stroke-width="1"/><text x="78.0" y="208.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">07BF</text><text x="130.0" y="208.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">task_key_scan</text><text x="320.0" y="208.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">debounce A/B/C into key_event</text><line x1="110.0" y1="218.0" x2="110.0" y2="224.0" stroke="#c3c2b7" stroke-width="1"/><rect x="60.0" y="224.0" width="6.0" height="30.0" rx="2" fill="#e87ba4"/><rect x="68.0" y="224.0" width="520.0" height="30.0" rx="4" fill="#f3f2ef" stroke="#c3c2b7" stroke-width="1"/><text x="78.0" y="244.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">0200</text><text x="130.0" y="244.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">task_key_dispatch</text><text x="320.0" y="244.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">route the key by mode</text><line x1="110.0" y1="254.0" x2="110.0" y2="260.0" stroke="#c3c2b7" stroke-width="1"/><rect x="60.0" y="260.0" width="6.0" height="30.0" rx="2" fill="#008300"/><rect x="68.0" y="260.0" width="520.0" height="30.0" rx="4" fill="#f3f2ef" stroke="#c3c2b7" stroke-width="1"/><text x="78.0" y="280.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">0800</text><text x="130.0" y="280.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">task_life_clock</text><text x="320.0" y="280.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">hunger, strength, poop, evolution timing</text><line x1="110.0" y1="290.0" x2="110.0" y2="296.0" stroke="#c3c2b7" stroke-width="1"/><rect x="60.0" y="296.0" width="6.0" height="30.0" rx="2" fill="#6250d6"/><rect x="68.0" y="296.0" width="520.0" height="30.0" rx="4" fill="#f3f2ef" stroke="#c3c2b7" stroke-width="1"/><text x="78.0" y="316.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">0A5D</text><text x="130.0" y="316.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">task_animation</text><text x="320.0" y="316.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">per-frame sprite motion</text><line x1="110.0" y1="326.0" x2="110.0" y2="332.0" stroke="#c3c2b7" stroke-width="1"/><rect x="60.0" y="332.0" width="6.0" height="30.0" rx="2" fill="#e34948"/><rect x="68.0" y="332.0" width="520.0" height="30.0" rx="4" fill="#f3f2ef" stroke="#c3c2b7" stroke-width="1"/><text x="78.0" y="352.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">0B06</text><text x="130.0" y="352.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">task_link_rx</text><text x="320.0" y="352.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">listen on the prong</text><line x1="110.0" y1="362.0" x2="110.0" y2="368.0" stroke="#c3c2b7" stroke-width="1"/><rect x="60.0" y="368.0" width="6.0" height="30.0" rx="2" fill="#2a78d6"/><rect x="68.0" y="368.0" width="520.0" height="30.0" rx="4" fill="#f3f2ef" stroke="#c3c2b7" stroke-width="1"/><text x="78.0" y="388.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">0B5B</text><text x="130.0" y="388.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">task_link_tx</text><text x="320.0" y="388.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">send a queued word</text><line x1="110.0" y1="398.0" x2="110.0" y2="404.0" stroke="#c3c2b7" stroke-width="1"/><rect x="60.0" y="404.0" width="6.0" height="30.0" rx="2" fill="#eb6834"/><rect x="68.0" y="404.0" width="520.0" height="30.0" rx="4" fill="#f3f2ef" stroke="#c3c2b7" stroke-width="1"/><text x="78.0" y="424.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">0410</text><text x="130.0" y="424.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">task_mode_render</text><text x="320.0" y="424.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">the mode state machine</text><line x1="110.0" y1="434.0" x2="110.0" y2="440.0" stroke="#c3c2b7" stroke-width="1"/><rect x="60.0" y="440.0" width="6.0" height="30.0" rx="2" fill="#1baf7a"/><rect x="68.0" y="440.0" width="520.0" height="30.0" rx="4" fill="#f3f2ef" stroke="#c3c2b7" stroke-width="1"/><text x="78.0" y="460.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">0A00</text><text x="130.0" y="460.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">task_sound</text><text x="320.0" y="460.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">sound sequencer</text><line x1="110.0" y1="470.0" x2="110.0" y2="476.0" stroke="#c3c2b7" stroke-width="1"/><rect x="60.0" y="476.0" width="6.0" height="30.0" rx="2" fill="#b9b7af"/><rect x="68.0" y="476.0" width="520.0" height="30.0" rx="4" fill="#f3f2ef" stroke="#c3c2b7" stroke-width="1"/><text x="78.0" y="496.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">0E7B</text><text x="130.0" y="496.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">rng_step</text><text x="320.0" y="496.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">advance the random counters</text><rect x="68.0" y="518.0" width="520.0" height="40.0" rx="4" fill="#dedcd5"/><text x="78.0" y="535.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal">idle?  (no keys, link quiet, mode allows)</text><text x="78.0" y="551.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">cpu_clock_slow → EI → HALT</text><path d="M 588 538 C 660 538, 660 95, 592 95" stroke="#52514e" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text x="672.0" y="289.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">busy: loop</text><text x="672.0" y="305.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, 