<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">E0C6200 address spaces as used by the Digimon V-Pet</title><desc id="d">Program ROM of 8192 12-bit words in 2 banks of 16 pages; data memory of 4-bit nibbles.</desc><rect width="100%" height="100%" fill="#fcfcfb"/><text x="24.0" y="32.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="bold">Two memories, two word sizes</text><text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Program: 12-bit instruction words.  Data: 4-bit nibbles.  Nothing else is byte-addressed.</text><text x="24.0" y="84.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">Program ROM  (8,192 × 12 bit)</text><text x="24.0" y="106.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">bank 0  (0x0000–0x0FFF)</text><rect x="24.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#eda100" fill-opacity="0.8"><title>bank 0 page 0: 256 words</title></rect><text x="35.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">0</text><rect x="50.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#eb6834" fill-opacity="0.8"><title>bank 0 page 1: 256 words</title></rect><text x="61.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">1</text><rect x="76.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#2a78d6" fill-opacity="0.8"><title>bank 0 page 2: 256 words</title></rect><text x="87.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">2</text><rect x="102.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#2a78d6" fill-opacity="0.8"><title>bank 0 page 3: 256 words</title></rect><text x="113.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">3</text><rect x="128.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#2a78d6" fill-opacity="0.8"><title>bank 0 page 4: 256 words</title></rect><text x="139.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">4</text><rect x="154.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#2a78d6" fill-opacity="0.8"><title>bank 0 page 5: 256 words</title></rect><text x="165.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">5</text><rect x="180.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#2a78d6" fill-opacity="0.8"><title>bank 0 page 6: 256 words</title></rect><text x="191.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">6</text><rect x="206.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#2a78d6" fill-opacity="0.8"><title>bank 0 page 7: 256 words</title></rect><text x="217.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">7</text><rect x="232.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#2a78d6" fill-opacity="0.8"><title>bank 0 page 8: 256 words</title></rect><text x="243.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">8</text><rect x="258.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#2a78d6" fill-opacity="0.8"><title>bank 0 page 9: 256 words</title></rect><text x="269.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">9</text><rect x="284.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#2a78d6" fill-opacity="0.8"><title>bank 0 page A: 256 words</title></rect><text x="295.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">A</text><rect x="310.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#2a78d6" fill-opacity="0.8"><title>bank 0 page B: 256 words</title></rect><text x="321.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">B</text><rect x="336.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#2a78d6" fill-opacity="0.8"><title>bank 0 page C: 256 words</title></rect><text x="347.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">C</text><rect x="362.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#2a78d6" fill-opacity="0.8"><title>bank 0 page D: 256 words</title></rect><text x="373.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">D</text><rect x="388.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#2a78d6" fill-opacity="0.8"><title>bank 0 page E: 256 words</title></rect><text x="399.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">E</text><rect x="414.0" y="114.0" width="23.0" height="30.0" rx="3" fill="#2a78d6" fill-opacity="0.8"><title>bank 0 page F: 256 words</title></rect><text x="425.5" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">F</text><text x="24.0" y="184.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">bank 1  (0x1000–0x1FFF)</text><rect x="24.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page 0: 256 words</title></rect><text x="35.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">0</text><rect x="50.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page 1: 256 words</title></rect><text x="61.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">1</text><rect x="76.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page 2: 256 words</title></rect><text x="87.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">2</text><rect x="102.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page 3: 256 words</title></rect><text x="113.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">3</text><rect x="128.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page 4: 256 words</title></rect><text x="139.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">4</text><rect x="154.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page 5: 256 words</title></rect><text x="165.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">5</text><rect x="180.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page 6: 256 words</title></rect><text x="191.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">6</text><rect x="206.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page 7: 256 words</title></rect><text x="217.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">7</text><rect x="232.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page 8: 256 words</title></rect><text x="243.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">8</text><rect x="258.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page 9: 256 words</title></rect><text x="269.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">9</text><rect x="284.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page A: 256 words</title></rect><text x="295.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">A</text><rect x="310.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page B: 256 words</title></rect><text x="321.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">B</text><rect x="336.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page C: 256 words</title></rect><text x="347.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">C</text><rect x="362.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page D: 256 words</title></rect><text x="373.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">D</text><rect x="388.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page E: 256 words</title></rect><text x="399.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">E</text><rect x="414.0" y="192.0" width="23.0" height="30.0" rx="3" fill="#6250d6" fill-opacity="0.8"><title>bank 1 page F: 256 words</title></rect><text x="425.5" y="236.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal">F</text><rect x="24.0" y="264.0" width="12.0" height="12.0" rx="2" fill="#eda100"/><text x="44.0" y="274.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">page 0: CALZ library (one-word calls from anywhere in the bank)</text><rect x="24.0" y="284.0" width="12.0" height="12.0" rx="2" fill="#eb6834"/><text x="44.0" y="294.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">page 1: reset at 0x100, interrupt vectors 0x102–0x10C, main loop at 0x132</text><rect x="24.0" y="304.0" width="12.0" height="12.0" rx="2" fill="#2a78d6"/><text x="44.0" y="314.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">bank 0: game logic</text><rect x="24.0" y="324.0" width="12.0" height="12.0" rx="2" fill="#6250d6"/><text x="44.0" y="334.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">bank 1: per-species graphics and animation handlers</text><text x="24.0" y="362.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Address = bank:page:step (1 + 4 + 8 bits). JP/CALL only reach their own page;</text><text x="24.0" y="378.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">PSET p in front of them selects another page (and bank) for that one jump.</text><text x="560.0" y="84.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">Data memory  (4-bit nibbles)</text><rect x="560.0" y="104.0" width="26.0" height="34.0" rx="3" fill="#1baf7a" fill-opacity="0.85"/><text x="596.0" y="118.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">000–0FF  RAM page 0</text><text x="596.0" y="133.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">game state, timers, link buffer, RNG, stack</text><rect x="560.0" y="146.0" width="26.0" height="34.0" rx="3" fill="#1baf7a" fill-opacity="0.85"/><text x="596.0" y="160.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">100–1FF  RAM page 1</text><text x="596.0" y="175.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">scratch / draw buffers (cleared by 0x004C)</text><rect x="560.0" y="188.0" width="26.0" height="34.0" rx="3" fill="#1baf7a" fill-opacity="0.85"/><text x="596.0" y="202.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">200–2FF  RAM page 2</text><text x="596.0" y="217.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">scratch 200–27F; sound note list 280–2FF (measured)</text><rect x="560.0" y="230.0" width="26.0" height="34.0" rx="3" fill="#e87ba4" fill-opacity="0.85"/><text x="596.0" y="244.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">E00–E4F  Display RAM 1</text><text x="596.0" y="259.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">bottom half of the dot matrix + 4 icons</text><rect x="560.0" y="272.0" width="26.0" height="34.0" rx="3" fill="#e87ba4" fill-opacity="0.85"/><text x="596.0" y="286.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">E80–ECF  Display RAM 2</text><text x="596.0" y="301.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">top half of the dot matrix + 4 icons</text><rect x="560.0" y="314.0" width="26.0" height="34.0" rx="3" fill="#e34948" fill-opacity="0.85"/><text x="596.0" y="328.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">F00–F7E  I/O registers</text><text x="596.0" y="343.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">24 used: timers, interrupts, K0 keys, P2 prong, buzzer, LCD, OSC</text><text x="560.0" y="374.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Pointers: X and Y are 12-bit (XP/YP page + 8-bit offset).</text><text x="560.0" y="390.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Helpers 0x0087/0x0089/0x008D/0x008F set the page before each access.</text></svg>