<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t d"><title id="t">How a sprite is stored: one LBPX per column</title><desc id="d">Eight LBPX instructions write eight column bytes; each byte's bits are the column's dots.</desc><rect width="100%" height="100%" fill="#fcfcfb"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><text x="24.0" y="32.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="bold">Sprites are code: one  lbpx M(X), byte  per column</text><text x="24.0" y="54.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">The empty heart of the hearts meter, drawn by 0x0563 draw_hearts_meter (operands at 0x056C–0x0573).</text><text x="40.0" y="106.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">056C  lbpx M(X), 0x00</text><text x="40.0" y="132.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">056D  lbpx M(X), 0x38</text><text x="40.0" y="158.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">056E  lbpx M(X), 0x44</text><text x="40.0" y="184.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">056F  lbpx M(X), 0x42</text><text x="40.0" y="210.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="normal">0570  lbpx M(X),